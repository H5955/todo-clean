<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🚀 My Todo App</h1>

        <!-- Add Task Form -->
        <form action="/add" method="post" class="task-form">

            <input
                type="text"
                name="task"
                placeholder="Enter task"
                required
            >

            <button type="submit">
                Add
            </button>

        </form>

        <!-- Search -->
        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            onkeyup="searchTasks()"
        >

        <!-- Todo List -->
        <div class="todo-list">

            {% for todo in todos %}

            <div class="task-card" onclick="toggleTask(this)">

                <div class="left">

                    <input type="checkbox">

                    <span>
                        {{ todo[1] }}
                    </span>

                </div>

                <div class="right">

                    <a href="/delete/{{ todo[0] }}">
                        <button class="delete-btn">
                            🗑
                        </button>
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- Animation Script -->
    <script>

        function toggleTask(task) {
            task.classList.toggle("completed");
        }

        function searchTasks() {

            let input = document.getElementById("searchInput").value.toLowerCase();

            let tasks = document.getElementsByClassName("task-card");

            for (let i = 0; i < tasks.length; i++) {

                let text = tasks[i].innerText.toLowerCase();

                if (text.includes(input)) {
                    tasks[i].style.display = "";
                } else {
                    tasks[i].style.display = "none";
                }
            }
        }

    </script>

</body>
</html>
