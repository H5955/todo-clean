<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>🚀 My Todo App</h1>

        <!-- Add Task Form -->
        <form action="/add" method="post" class="task-form">

            <input
                type="text"
                name="task"
                placeholder="Enter a task..."
                required
            >

            <input
                type="date"
                name="due_date"
                required
            >

            <button type="submit">
                Add
            </button>

        </form>

        <!-- Search Box -->
        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            onkeyup="searchTasks()"
        >

        <!-- Todo List -->
        <div class="todo-list">

            {% for todo in todos %}

            <div class="task-card {% if todo[2] == 1 %}completed{% endif %}">

                <div class="left">

                    <!-- Complete -->
                    <a href="/complete/{{ todo[0] }}">

                        {% if todo[2] == 1 %}
                        <input type="checkbox" checked>
                        {% else %}
                        <input type="checkbox">
                        {% endif %}

                    </a>

                    <!-- Task -->
                    <div>

                        <span>
                            {{ todo[1] }}
                        </span>

                        {% if todo|length > 3 %}

                        <br>

                        <small>
                            📅 Due: {{ todo[3] }}
                        </small>

                        {% endif %}

                    </div>

                </div>

                <!-- Delete -->
                <div class="right">

                    <a href="/delete/{{ todo[0] }}">

                        <button class="delete-btn">
                            🗑
                        </button>

                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

    <script>

        function searchTasks() {

            let input =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            let tasks =
                document.getElementsByClassName("task-card");

            for (let i = 0; i < tasks.length; i++) {

                let text =
                    tasks[i].innerText.toLowerCase();

                if (text.includes(input)) {

                    tasks[i].style.display = "";

                } else {

                    tasks[i].style.display = "none";
                }
            }
        }

    </script>

</body>
</html>
