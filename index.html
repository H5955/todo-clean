<!DOCTYPE html>
<html>

<head>
    <title>Todo App</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <h1>🚀 My Todo App</h1>

    <form action="/add" method="post">

        <input
            type="text"
            name="task"
            placeholder="Enter task"
            required
        >

        <button type="submit">
            Add
        </button>

    </form>

    <hr>

    {% for todo in todos %}

    <div>

        <p>{{ todo[1] }}</p>

        <a href="/delete/{{ todo[0] }}">
            Delete
        </a>

    </div>

    <hr>

    {% endfor %}

</body>

</html>
